# F1 Dashboard 屏保成图静态服务(部署到 /etc/nginx/sites-available/f1dash.conf)
# Kindle 经 http://<host>:8080/f1/latest.png 下载;端口需同时在
# iptables 与 Oracle 控制台 VCN Security List 放行
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location /f1/ {
        alias /opt/f1dash/out/;
        autoindex off;
        etag on;
        add_header Cache-Control "no-cache";
    }

    # 遥测接收端:Kindle POST /api/telemetry → 本机 127.0.0.1:8081
    # (cloud/telemetry_server.py,仅标准库)。GET /api/telemetry 读最新一份。
    # 注意:与 latest.png 同等公开暴露(v1 无鉴权),见 telemetry_server.py 头注。
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
        client_max_body_size 64k;
    }
}

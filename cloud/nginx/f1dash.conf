# F1 Dashboard 屏保成图静态服务(部署到 /etc/nginx/sites-available/f1dash.conf)
# Kindle 经 http://<host>:8080/f1/latest.png 下载;端口需同时在
# iptables 与 Oracle 控制台 VCN Security List 放行
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location /f1/ {
        alias /opt/f1dash/out/;
        autoindex off;
        etag on;
        add_header Cache-Control "no-cache";
    }
}
